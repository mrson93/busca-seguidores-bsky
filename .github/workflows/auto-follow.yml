name: Follow automático no Bluesky

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-follow-bsky
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restaurar histórico de unfollows
        id: restore-state
        uses: actions/cache/restore@v5
        with:
          path: .auto-follow-state.json
          key: auto-follow-state-${{ github.run_id }}
          restore-keys: auto-follow-state-
      - name: Importar estado inicial da migração
        if: steps.restore-state.outputs.cache-matched-key == ''
        env:
          MIGRATED_STATE: ${{ secrets.AUTO_FOLLOW_STATE_GZIP_B64 }}
        run: |
          if [ -z "$MIGRATED_STATE" ]; then
            echo "Estado de unfollows ausente; execução interrompida para evitar refollows."
            exit 1
          fi
          printf '%s' "$MIGRATED_STATE" | base64 --decode | gzip --decompress > .auto-follow-state.json
          test -s .auto-follow-state.json
      - name: Remover quem não segue de volta
        run: node auto-unfollow.mjs --execute
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          AUTO_UNFOLLOW_GRACE_DAYS: 3
          AUTO_UNFOLLOW_CLEAN_STALE_RECORDS: true
      - name: Buscar e seguir perfis
        run: node auto-follow.mjs --execute
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          AUTO_FOLLOW_RATIO_PCT: 25
      - name: Salvar histórico de unfollows
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .auto-follow-state.json
          key: auto-follow-state-${{ github.run_id }}

  follow-secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar configuração da segunda conta
        id: account
        env:
          BSKY_HANDLE: ${{ secrets.SECONDARY_BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.SECONDARY_BSKY_APP_PASSWORD }}
        run: |
          if [ -n "$BSKY_HANDLE" ] && [ -n "$BSKY_APP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Segunda conta ainda não configurada; rotina ignorada com segurança."
          fi
      - name: Baixar o projeto
        if: steps.account.outputs.configured == 'true'
        uses: actions/checkout@v6
      - name: Preparar Node.js
        if: steps.account.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restaurar estado da segunda conta
        if: steps.account.outputs.configured == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .auto-follow-state-secondary.json
          key: auto-follow-state-secondary-${{ github.run_id }}
          restore-keys: auto-follow-state-secondary-
      - name: Remover perfis da segunda conta
        if: steps.account.outputs.configured == 'true'
        run: node auto-unfollow.mjs --execute
        env:
          BSKY_HANDLE: ${{ secrets.SECONDARY_BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.SECONDARY_BSKY_APP_PASSWORD }}
          AUTO_FOLLOW_STATE_FILE: .auto-follow-state-secondary.json
      - name: Buscar e seguir fãs de filmes e séries
        if: steps.account.outputs.configured == 'true'
        run: node auto-follow.mjs --execute
        env:
          BSKY_HANDLE: ${{ secrets.SECONDARY_BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.SECONDARY_BSKY_APP_PASSWORD }}
          AUTO_FOLLOW_STATE_FILE: .auto-follow-state-secondary.json
          AUTO_FOLLOW_RATIO_PCT: 30
          AUTO_FOLLOW_SEARCH_TERMS: filme,filmes,cinema,série,séries,seriado,seriados
          AUTO_FOLLOW_MAX_PAGES: 5
      - name: Salvar estado da segunda conta
        if: always() && steps.account.outputs.configured == 'true'
        uses: actions/cache/save@v5
        with:
          path: .auto-follow-state-secondary.json
          key: auto-follow-state-secondary-${{ github.run_id }}
