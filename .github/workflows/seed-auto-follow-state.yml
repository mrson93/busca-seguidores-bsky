name: Importar estado inicial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Restaurar estado migrado
        env:
          MIGRATED_STATE: ${{ secrets.AUTO_FOLLOW_STATE_GZIP_B64 }}
        run: |
          test -n "$MIGRATED_STATE"
          printf '%s' "$MIGRATED_STATE" | base64 --decode | gzip --decompress > .auto-follow-state.json
          test -s .auto-follow-state.json
      - name: Salvar estado no novo repositório
        uses: actions/cache/save@v5
        with:
          path: .auto-follow-state.json
          key: auto-follow-state-${{ github.run_id }}
